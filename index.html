<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Marjia</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:'Hind Siliguri', sans-serif;
    background:black;
}

/* PAGE */

.page{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:black;
}

/* STARS */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite;
}

@keyframes blink{
    0%,100%{
        opacity:.2;
    }
    50%{
        opacity:1;
    }
}

/* TEXT */

.text-box{
    position:absolute;
    top:60px; /* লেখাগুলো উপরে */
    width:100%;
    text-align:center;
    z-index:10;
    padding:0 15px;
}

.text-box h1{
    color:white;
    font-size:45px;
    line-height:1.4;
    text-shadow:
    0 0 10px #ff4da6,
    0 0 20px #ff4da6,
    0 0 40px #ff4da6;
    animation:glow 2s infinite alternate;
}

.text-box p{
    margin-top:30px;
    color:white;
    font-size:26px;
    line-height:1.8;
    font-weight:bold;
    text-shadow:
    0 0 10px #ff4da6,
    0 0 20px #ff4da6;
}

@keyframes glow{
    from{
        text-shadow:
        0 0 10px white,
        0 0 20px #ff4da6;
    }

    to{
        text-shadow:
        0 0 20px white,
        0 0 40px #ff4da6,
        0 0 60px #ff4da6;
    }
}

/* FLOWERS AREA */

.flowers{
    position:absolute;
    bottom:20px;
    width:100%;
    height:45%;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:25px;
}

/* FLOWER */

.flower{
    position:relative;
    width:120px;
    height:300px;
    animation:up 2s ease forwards;
}

.flower:nth-child(2){
    transform:scale(1.1);
}

.flower:nth-child(3){
    transform:scale(.9);
}

@keyframes up{
    from{
        transform:translateY(300px);
        opacity:0;
    }

    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* STEM */

.stem{
    position:absolute;
    width:7px;
    height:180px;
    background:linear-gradient(#1aff66,#008f39);
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    border-radius:20px;
}

/* LEAVES */

.leaf{
    position:absolute;
    width:50px;
    height:18px;
    background:linear-gradient(#00ff66,#007a33);
    border-radius:50px 0;
}

.leaf1{
    left:18px;
    bottom:80px;
    transform:rotate(-40deg);
}

.leaf2{
    right:18px;
    bottom:120px;
    transform:rotate(40deg);
}

/* FLOWER PETALS */

.petal{
    position:absolute;
    width:48px;
    height:48px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 12px rgba(255,255,255,.8);
}

/* PETAL POSITIONS */

.p1{
    top:25px;
    left:36px;
}

.p2{
    top:55px;
    left:8px;
}

.p3{
    top:55px;
    right:8px;
}

.p4{
    top:85px;
    left:36px;
}

/* CENTER */

.center{
    position:absolute;
    width:28px;
    height:28px;
    background:#ffe600;
    border-radius:50%;
    top:62px;
    left:46px;
    z-index:2;
    box-shadow:0 0 20px yellow;
}

/* GLOW PARTICLES */

.spark{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:white;
    animation:spark 3s linear infinite;
}

@keyframes spark{

    0%{
        transform:translateY(0) scale(.4);
        opacity:0;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:translateY(-160px) scale(1.5);
        opacity:0;
    }

}

/* MOBILE */

@media(max-width:600px){

.text-box{
    top:40px;
}

.text-box h1{
    font-size:35px;
}

.text-box p{
    font-size:20px;
}

.flower{
    width:90px;
    height:250px;
}

.petal{
    width:38px;
    height:38px;
}

.p1{
    left:26px;
}

.p2{
    left:2px;
}

.p3{
    right:2px;
}

.p4{
    left:26px;
}

.center{
    width:22px;
    height:22px;
    left:34px;
}

}

</style>
</head>

<body>

<div class="page">

    <!-- TEXT -->

    <div class="text-box">

        <h1>
            🎂 Happy Birthday Marjia 💖✨
        </h1>

        <p>
            তোমার জীবনের প্রতিটি মুহূর্ত হোক <br>
            সুখ, হাসি আর ভালোবাসায় ভরা 🌸 <br><br>

            তোমার সব স্বপ্ন পূরণ হোক ✨ <br>
            সবসময় এভাবেই হাসিখুশি থাকো 😊💕 <br><br>

            Enjoy your beautiful day princess 👑💫
        </p>

    </div>

    <!-- FLOWERS -->

    <div class="flowers">

        <!-- FLOWER 1 -->

        <div class="flower">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>

            <div class="center"></div>

            <div class="stem"></div>

            <div class="leaf leaf1"></div>
            <div class="leaf leaf2"></div>

        </div>

        <!-- FLOWER 2 -->

        <div class="flower">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>

            <div class="center"></div>

            <div class="stem"></div>

            <div class="leaf leaf1"></div>
            <div class="leaf leaf2"></div>

        </div>

        <!-- FLOWER 3 -->

        <div class="flower">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>

            <div class="center"></div>

            <div class="stem"></div>

            <div class="leaf leaf1"></div>
            <div class="leaf leaf2"></div>

        </div>

    </div>

</div>

<!-- MUSIC -->

<audio autoplay loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<script>

/* STARS */

for(let i=0;i<180;i++){

    let star=document.createElement("div");

    star.classList.add("star");

    star.style.left=Math.random()*100+"%";

    star.style.top=Math.random()*100+"%";

    star.style.animationDelay=Math.random()*3+"s";

    document.body.appendChild(star);

}

/* SPARKS */

for(let i=0;i<50;i++){

    let spark=document.createElement("div");

    spark.classList.add("spark");

    spark.style.left=Math.random()*100+"%";

    spark.style.bottom=Math.random()*250+"px";

    spark.style.animationDelay=Math.random()*3+"s";

    document.body.appendChild(spark);

}

</script>

</body>
</html>
