<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Marjia</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:black;
}

/* Background */

.page{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#1b1b2f,#000);
}

/* Stars */

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite;
}

@keyframes blink{
    0%,100%{
        opacity:.2;
    }
    50%{
        opacity:1;
    }
}

/* Text */

.text{
    position:absolute;
    top:40px;
    width:100%;
    text-align:center;
    color:white;
    z-index:5;
    padding:20px;
    animation:fadeIn 2s ease;
}

.text h1{
    font-size:42px;
    line-height:1.5;
    text-shadow:0 0 25px #ff66c4;
    color:#fff;
}

.text p{
    margin-top:18px;
    font-size:20px;
    line-height:1.9;
    color:#f5f5f5;
    text-shadow:0 0 10px rgba(255,255,255,.5);
}

.sign{
    margin-top:25px;
    font-size:24px;
    color:#ff9de2;
    font-weight:bold;
}

/* Fade Animation */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Sakura Tree */

.tree{
    position:absolute;
    bottom:0;
    width:100%;
    height:45vh;
    display:flex;
    justify-content:center;
    align-items:flex-end;
}

/* Tree Trunk */

.trunk{
    width:28px;
    height:220px;
    background:#5c3b1e;
    border-radius:20px;
    position:relative;
}

/* Branches */

.branch{
    position:absolute;
    width:140px;
    height:12px;
    background:#5c3b1e;
    border-radius:20px;
}

.b1{
    top:40px;
    left:-120px;
    transform:rotate(-25deg);
}

.b2{
    top:80px;
    right:-120px;
    transform:rotate(25deg);
}

.b3{
    top:130px;
    left:-100px;
    transform:rotate(-15deg);
}

.b4{
    top:160px;
    right:-100px;
    transform:rotate(15deg);
}

/* Sakura Flowers */

.flower{
    position:absolute;
    width:18px;
    height:18px;
    background:pink;
    border-radius:50%;
    box-shadow:
    10px 0 pink,
    -10px 0 pink,
    0 10px pink,
    0 -10px pink;
}

/* Flower Positions */

.f1{
    top:15px;
    left:-125px;
}

.f2{
    top:65px;
    right:-125px;
}

.f3{
    top:120px;
    left:-105px;
}

.f4{
    top:145px;
    right:-105px;
}

/* Falling Flowers */

.petals{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.petal{
    position:absolute;
    color:#ffb6d9;
    font-size:20px;
    animation:fall linear infinite;
}

@keyframes fall{

    0%{
        transform:translateY(-100px) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }

}

/* Glow */

.glow{
    position:absolute;
    width:300px;
    height:300px;
    background:#ff66c4;
    filter:blur(120px);
    opacity:.25;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* Mobile */

@media(max-width:600px){

.text h1{
    font-size:30px;
}

.text p{
    font-size:17px;
}

.sign{
    font-size:20px;
}

.trunk{
    height:180px;
}

}

</style>
</head>

<body>

<div class="page">

    <div class="glow"></div>

    <!-- Stars -->

    <div id="stars"></div>

    <!-- Falling Flowers -->

    <div class="petals" id="petals"></div>

    <!-- Text -->

    <div class="text">

        <h1>
            🎂 Happy Birthday Marjia 💖✨
        </h1>

        <p>
            তোমার জীবনের প্রতিটি মুহূর্ত হোক সুখ, হাসি আর ভালোবাসায় ভরা 🌸 <br>

            তোমার সব স্বপ্ন পূরণ হোক এবং সবসময় এভাবেই হাসিখুশি থাকো 😊💕 <br><br>

            আজকের দিনটা শুধু তোমার জন্যই স্পেশাল 🎉 <br>

            Enjoy your beautiful day princess 👑💫
        </p>

        <div class="sign">
            — Best Wishes For You 💝
        </div>

    </div>

    <!-- Sakura Tree -->

    <div class="tree">

        <div class="trunk">

            <div class="branch b1"></div>
            <div class="branch b2"></div>
            <div class="branch b3"></div>
            <div class="branch b4"></div>

            <div class="flower f1"></div>
            <div class="flower f2"></div>
            <div class="flower f3"></div>
            <div class="flower f4"></div>

        </div>

    </div>

</div>

<script>

/* Stars */

for(let i=0;i<120;i++){

    let star=document.createElement("div");

    star.classList.add("star");

    star.style.left=Math.random()*100+"%";

    star.style.top=Math.random()*100+"%";

    star.style.animationDelay=Math.random()*2+"s";

    document.body.appendChild(star);

}

/* Falling Sakura Flowers */

const petals=document.getElementById("petals");

for(let i=0;i<45;i++){

    let petal=document.createElement("div");

    petal.classList.add("petal");

    petal.innerHTML="🌸";

    petal.style.left=Math.random()*100+"%";

    petal.style.animationDuration=(5+Math.random()*5)+"s";

    petal.style.animationDelay=Math.random()*5+"s";

    petals.appendChild(petal);

}

</script>

</body>
</html>
