<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    background:black;
}

/* First Page */

.page1{
    width:100%;
    height:100vh;
    background:linear-gradient(135deg,#ff4da6,#ff6b81,#ff9f43);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    position:relative;
    overflow:hidden;
}

/* Floating Hearts */

.heart{
    position:absolute;
    color:white;
    font-size:25px;
    animation:float 6s linear infinite;
    opacity:.7;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(.5);
    }
    100%{
        transform:translateY(-120px) scale(1.4);
    }
}

/* Love Card */

.card{
    width:90%;
    max-width:360px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
    border-radius:30px;
    padding:35px 20px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
    animation:popup 1s ease;
}

@keyframes popup{
    from{
        transform:scale(.6);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.emoji{
    font-size:90px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-12px);
    }
}

.card h1{
    color:white;
    font-size:34px;
    margin-top:20px;
    line-height:1.4;
    text-shadow:0 0 15px rgba(255,255,255,.5);
}

.card p{
    color:white;
    margin-top:15px;
    font-size:18px;
}

/* Buttons */

.buttons{
    margin-top:35px;
    display:flex;
    justify-content:center;
    gap:15px;
}

button{
    border:none;
    padding:14px 26px;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.yes{
    background:white;
    color:#ff4da6;
}

.yes:hover{
    transform:scale(1.1);
}

.no{
    background:#fff3;
    color:white;
}

/* Second Page */

.page2{
    width:100%;
    height:100vh;
    background:black;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    position:relative;
    overflow:hidden;
}

/* Stars */

.stars{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite;
}

@keyframes blink{
    0%,100%{
        opacity:.2;
    }
    50%{
        opacity:1;
    }
}

/* Text */

.love-text{
    position:absolute;
    top:50px;
    text-align:center;
    color:white;
    font-size:40px;
    font-weight:bold;
    text-shadow:0 0 20px white;
    animation:glow 2s infinite alternate;
    z-index:5;
    padding:0 20px;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px white;
    }
    to{
        text-shadow:0 0 25px #ff4da6;
    }
}

/* Flowers */

.flowers{
    position:absolute;
    bottom:60px;
    display:flex;
    gap:30px;
}

.flower{
    position:relative;
    width:80px;
    height:200px;
    animation:up 2s ease forwards;
}

@keyframes up{
    from{
        transform:translateY(250px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* Stem */

.stem{
    position:absolute;
    width:6px;
    height:120px;
    background:#2ecc71;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    border-radius:20px;
}

/* Petals */

.petal{
    width:35px;
    height:35px;
    background:white;
    border-radius:50%;
    position:absolute;
}

.center{
    width:20px;
    height:20px;
    background:yellow;
    border-radius:50%;
    position:absolute;
    top:28px;
    left:30px;
    z-index:2;
}

.p1{
    top:10px;
    left:22px;
}

.p2{
    top:28px;
    left:5px;
}

.p3{
    top:28px;
    left:40px;
}

.p4{
    top:50px;
    left:22px;
}

/* Glow Particles */

.spark{
    position:absolute;
    width:4px;
    height:4px;
    background:#fff;
    border-radius:50%;
    animation:spark 3s linear infinite;
}

@keyframes spark{
    0%{
        transform:translateY(0) scale(.5);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    100%{
        transform:translateY(-150px) scale(1.4);
        opacity:0;
    }
}

</style>
</head>

<body>

<!-- First Page -->

<div class="page1" id="page1">

    <!-- Hearts -->
    <div class="heart" style="left:10%; animation-delay:0s;">💖</div>
    <div class="heart" style="left:30%; animation-delay:1s;">💕</div>
    <div class="heart" style="left:50%; animation-delay:2s;">💗</div>
    <div class="heart" style="left:70%; animation-delay:3s;">💞</div>
    <div class="heart" style="left:85%; animation-delay:4s;">💓</div>

    <!-- Card -->
    <div class="card">

        <div class="emoji">🎂💖</div>

        <h1>
            তোমার জন্য একটি বিশেষ Birthday Surprise ✨
        </h1>

        <p>
            নিচের বাটনে ক্লিক করো 💕
        </p>

        <div class="buttons">

            <button class="yes" onclick="openLove()">
                Yes 💖
            </button>

            <button class="no">
                Of Course 😍
            </button>

        </div>

    </div>

</div>

<!-- Second Page -->

<div class="page2" id="page2">

    <!-- Stars -->
    <div class="stars" id="stars"></div>

    <!-- Text -->
    <div class="love-text">
        Happy Birthday Wish <br>
        Marjia 🎂💖
    </div>

    <!-- Flowers -->
    <div class="flowers">

        <div class="flower">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>

            <div class="center"></div>

            <div class="stem"></div>

        </div>

        <div class="flower" style="animation-delay:.5s;">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>

            <div class="center"></div>

            <div class="stem"></div>

        </div>

        <div class="flower" style="animation-delay:1s;">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>

            <div class="center"></div>

            <div class="stem"></div>

        </div>

    </div>

</div>

<!-- Music -->

<audio id="music" loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<script>

/* Open Second Page */

function openLove(){

    document.getElementById("page1").style.display="none";

    document.getElementById("page2").style.display="flex";

    document.getElementById("music").play();

}

/* Stars */

const stars = document.getElementById("stars");

for(let i=0;i<120;i++){

    let star = document.createElement("div");

    star.classList.add("star");

    star.style.left=Math.random()*100+"%";

    star.style.top=Math.random()*100+"%";

    star.style.animationDelay=Math.random()*3+"s";

    stars.appendChild(star);

}

/* Spark Effects */

for(let i=0;i<40;i++){

    let spark=document.createElement("div");

    spark.classList.add("spark");

    spark.style.left=Math.random()*100+"%";

    spark.style.bottom=Math.random()*200+"px";

    spark.style.animationDelay=Math.random()*3+"s";

    document.getElementById("page2").appendChild(spark);

}

</script>

</body>
  </html>
